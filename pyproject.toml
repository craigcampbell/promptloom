[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptloom"
version = "0.2.0"
description = "Search, tag and connect every prompt you type into AI coding tools (Claude Code, Codex, Copilot, ...), with a local app, timelines and a graph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Craig Campbell" }]
keywords = ["ai", "prompts", "claude-code", "codex", "copilot", "mcp", "obsidian"]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/craigcampbell/promptloom"
Issues = "https://github.com/craigcampbell/promptloom/issues"

[project.scripts]
promptloom = "promptloom.__main__:main"
